; Arcade Tournament Manager - ESP8266 NodeMCU RFID Reader
; PlatformIO configuration
;
; To use PlatformIO:
;   1. Open this folder in VS Code (install PlatformIO extension)
;   2. Edit WiFi credentials and SERVER_URL in arcade_rfid_reader.ino
;   3. Click "Upload and Monitor" in the PlatformIO toolbar

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    miguelbalboa/MFRC522@^1.4.10